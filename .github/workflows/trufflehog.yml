name: TruffleHog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full rescan
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TruffleHog (filesystem, offline)
        run: bash scripts/ci/trufflehog-scan.sh "${{ github.workspace }}"
