# A 10m job timeout fails a stalled wasm-bindgen download fast (galaxy-gen#89).
# Why: docs/development.md, CI.
name: build-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: docker
    timeout-minutes: 10
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-command.sh just ci-setup
      - run: bash scripts/ci-command.sh just lint-rust
      - run: bash scripts/ci-command.sh just test-rust
      - run: bash scripts/ci-command.sh just check-js
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish:
    needs: test
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Publish immutable galaxy-gen image
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/publish-image.sh
