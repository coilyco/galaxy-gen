name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # rust
      - run: cargo build
      - run: cargo check
      - name: Rust lint gate
        run: bash scripts/ward-command.sh lint-rust
      - run: cargo test

      # wasm
      - run: cargo install wasm-pack
      - name: Install binaryen (pinned release)
        run: bash scripts/ci/install-binaryen.sh
      - run: wasm-pack build
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # wasm
      - run: cargo install wasm-pack
      - name: Install binaryen (pinned release)
        run: bash scripts/ci/install-binaryen.sh
      - run: wasm-pack build

      # js
      - run: npm ci
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [rust, js]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: cargo install wasm-pack
      - name: Install binaryen (pinned release)
        run: bash scripts/ci/install-binaryen.sh
      - run: wasm-pack build

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
