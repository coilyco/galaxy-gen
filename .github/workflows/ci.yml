# The Rust and JS gate through the same `just` verbs a developer runs. It is also the
# `test` job of build-publish. Why the job timeout: .agents/skills/coding-galaxy-gen-internals/references/ci-timeouts.md
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: bash scripts/ci/install-wasm-pack.sh

      - name: Install binaryen (pinned release)
        run: bash scripts/ci/install-binaryen.sh

      - run: just ci-setup
      - run: just lint-rust
      - run: just test-rust
      - run: just check-js

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py
