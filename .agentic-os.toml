# Consumer-side opt-outs for agentic-os tree-walking hooks.

[catalog-trifecta]
# AGENTS.md predates the 8-section trifecta layout; restructuring it is part
# of the doc-cleanup follow-up, not this catalog migration.
enabled = false

[code-comments]
# The v0.21.0+ code-comments hook allows YAML comments only in the top header
# block (a key-sorter would drift a mid-file comment from its target). This
# repo's YAML is operational config - a multi-document k8s manifest, CI
# workflows, command allowlists - whose inline comments explain the specific
# resource or key they sit beside, so hoisting them to a top header or docs/
# would strip that locality. Excluded here (the same escape hatch eco-* repos
# use to skip code-comments) so the hook still governs Rust/TS/JS source, where
# the two-line rule fits. See galaxy-gen#24.
excludes = [
  "deploy/",
  ".forgejo/",
  ".github/",
  ".agents/skills/categories.yaml",
  ".pre-commit-config.yaml",
]
