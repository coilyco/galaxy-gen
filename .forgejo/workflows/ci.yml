# A 10m job timeout fails a stalled wasm-bindgen download fast (galaxy-gen#89).
# Why: docs/development.md, CI.
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 10
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - run: just ci-setup
      - run: just lint-rust
      - run: just test-rust
      - run: just check-js
